name: Release

# Release v1.2.3 -> release archive + Docker image (GHCR) + DRAFT GitHub release.
# Called by release-please.yml after the release PR is merged (input "tag"), or started by pushing a tag by hand.
# Job "sign" runs in the environment "release" (required reviewer), signs with the secret UPDATE_SIGNING_KEY and
# attaches manifest.json and manifest.json.sig. The operator reviews the draft and publishes it.

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  build:
    outputs:
      version: ${{ steps.v.outputs.version }}
      image: ${{ steps.v.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Version from tag
        id: v
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version="${TAG#v}"
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
          if ! [[ "$version" =~ $semver ]]; then echo "tag $TAG is not v<SemVer>" >&2; exit 1; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, pdo_sqlite, gd, intl, zip
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: composer install --no-dev -o --no-interaction --prefer-dist
      - run: npm ci && npm run build
      - name: Build archive
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: php tools/release/build-archive.php "$VERSION" --out=dist
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.v.outputs.image }}:${{ steps.v.outputs.version }}
          build-args: IGNIS_VERSION=${{ steps.v.outputs.version }}
      - name: Draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
          IMAGE: ${{ steps.v.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          images="$(printf '## Docker-Image\n\nImage: `%s`\nImage digest: `%s`\n' "$IMAGE" "$DIGEST")"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # draft made by release-please: add the archive and the image lines to its notes
            gh release upload "$TAG" "dist/ignis-${VERSION}.zip" --clobber
            printf '%s\n\n%s\n' "$(gh release view "$TAG" --json body -q .body)" "$images" > notes.md
            gh release edit "$TAG" --notes-file notes.md
          else
            printf 'Version %s\n\n%s\n' "$VERSION" "$images" > notes.md
            flags=""
            case "$VERSION" in *-*) flags="--prerelease" ;; esac
            gh release create "$TAG" "dist/ignis-${VERSION}.zip" --draft $flags --title "$TAG" --notes-file notes.md
          fi

  sign:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      # only code that went through main (PR and CI) may use the key
      - run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, sodium, zip
          coverage: none
      - run: composer install --no-dev -o --no-interaction --prefer-dist
      - name: Sign and upload manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
          SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          VERSION: ${{ needs.build.outputs.version }}
          IMAGE: ${{ needs.build.outputs.image }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          mkdir dist
          gh release download "$TAG" -p "ignis-${VERSION}.zip" -D dist --repo "$GITHUB_REPOSITORY"
          key="$RUNNER_TEMP/update-private.key"
          (umask 077 && printf '%s' "$SIGNING_KEY" > "$key")
          php tools/release/sign.php "dist/ignis-${VERSION}.zip" --key="$key" --image="$IMAGE" --image-digest="$DIGEST"
          rm -f "$key"
          gh release upload "$TAG" dist/manifest.json dist/manifest.json.sig --clobber --repo "$GITHUB_REPOSITORY"
