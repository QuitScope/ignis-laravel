name: Release

# Tag v1.2.3 -> release archive + Docker image (GHCR) + DRAFT GitHub release.
# Job "sign" runs in the environment "release" (required reviewer), signs with the secret UPDATE_SIGNING_KEY and
# attaches manifest.json and manifest.json.sig. The operator reviews the draft and publishes it.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  build:
    outputs:
      version: ${{ steps.v.outputs.version }}
      image: ${{ steps.v.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Version from tag
        id: v
        run: |
          version="${GITHUB_REF_NAME#v}"
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
          if ! [[ "$version" =~ $semver ]]; then echo "tag $GITHUB_REF_NAME is not v<SemVer>" >&2; exit 1; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, pdo_sqlite, gd, intl, zip
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: composer install --no-dev -o --no-interaction --prefer-dist
      - run: npm ci && npm run build
      - name: Build archive
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: php tools/release/build-archive.php "$VERSION" --out=dist
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.v.outputs.image }}:${{ steps.v.outputs.version }}
          build-args: IGNIS_VERSION=${{ steps.v.outputs.version }}
      - name: Draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ steps.v.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          cat > notes.md <<EOF
          Version ${VERSION}

          Image: \`${IMAGE}\`
          Image digest: \`${DIGEST}\`

          Draft: the archive is signed after approval; check the notes and publish.
          EOF
          flags=""
          case "$VERSION" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" "dist/ignis-${VERSION}.zip" --draft $flags --title "$GITHUB_REF_NAME" --notes-file notes.md

  sign:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, sodium, zip
          coverage: none
      - run: composer install --no-dev -o --no-interaction --prefer-dist
      - name: Sign and upload manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          VERSION: ${{ needs.build.outputs.version }}
          IMAGE: ${{ needs.build.outputs.image }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          mkdir dist
          gh release download "$GITHUB_REF_NAME" -p "ignis-${VERSION}.zip" -D dist --repo "$GITHUB_REPOSITORY"
          key="$RUNNER_TEMP/update-private.key"
          (umask 077 && printf '%s' "$SIGNING_KEY" > "$key")
          php tools/release/sign.php "dist/ignis-${VERSION}.zip" --key="$key" --image="$IMAGE" --image-digest="$DIGEST"
          rm -f "$key"
          gh release upload "$GITHUB_REF_NAME" dist/manifest.json dist/manifest.json.sig --clobber --repo "$GITHUB_REPOSITORY"
