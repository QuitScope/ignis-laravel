# Included at server level (server-opts.d). Realtime: the WebSocket path /app goes to the internal `reverb`
# service, so browsers use the app's own origin (no second port, no CORS, no CSP change). Reverb's HTTP API (/apps)
# stays internal: only the app posts to it, directly at reverb:8081.
# Variable + Docker resolver: nginx resolves at request time, so it also starts without the reverb service (profile
# off); /app then answers 502 and the pages keep polling.
location ^~ /app/ {
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $reverb_upstream reverb:8081;
    proxy_pass http://$reverb_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Above Reverb's ping interval (60 s), so idle sockets are not cut.
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
}
