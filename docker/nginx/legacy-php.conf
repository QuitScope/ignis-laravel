# Included at server level (server-opts.d). ef_bridge and old bookmarks call `*.php` URLs
# (`/api/emd/sync.php`, `/auth/callback.php`, ...). Without this, `location ~ \.php$` would hand
# them to PHP-FPM as missing scripts (404). Server-level rewrites run before location matching:
# drop the suffix so `try_files` falls back to index.php. Laravel still sees the original
# REQUEST_URI ($request_uri) and NormalizeLegacyPath maps it. Query string is kept by nginx.
# `/index.php` itself is excluded, so the front controller is untouched; public/ holds no other
# PHP file, so no other script stays reachable.
rewrite ^(/(?!index\.php$).+)\.php$ $1 last;
